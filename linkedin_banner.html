<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1584"/>
<title>Aditya Nain — LinkedIn Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background: #060b14;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  #bg { position:absolute; top:0; left:0; }

  /* ── Layout ──────────────────────────────────────────── */
  .layout {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
  }

  /* left art area */
  .art-zone { width: 510px; flex-shrink: 0; position: relative; }

  /* vertical accent rule */
  .vr {
    width: 1px;
    height: 230px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(0,220,130,0.6) 30%,
      rgba(0,220,130,0.6) 70%,
      transparent 100%
    );
    flex-shrink: 0;
    margin: 0 52px 0 0;
  }

  /* right text block */
  .text {
    flex: 1;
    padding-right: 72px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* terminal label */
  .term-label {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 10.5px;
    color: #00dc82;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .term-label .blink {
    display: inline-block;
    width: 7px; height: 13px;
    background: #00dc82;
    margin-left: 2px;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .term-label::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00dc82;
    box-shadow: 0 0 6px #00dc82;
  }

  /* name */
  .name {
    font-size: 62px;
    font-weight: 900;
    color: #f1f5f9;
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin-bottom: 14px;
  }
  .name .accent { color: #00dc82; }

  /* title rule */
  .title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .title-line {
    width: 32px; height: 2px;
    background: linear-gradient(90deg, #00dc82, transparent);
    flex-shrink: 0;
  }
  .title-text {
    font-size: 13.5px;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  /* subtitle */
  .sub {
    font-size: 12px;
    color: #4a5568;
    letter-spacing: 0.04em;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sub-sep { color: #1e3a5f; font-size: 14px; }

  /* tech pills */
  .pills {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .pill {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 4px 11px;
    border: 1px solid rgba(0,220,130,0.22);
    border-radius: 100px;
    color: rgba(0,220,130,0.8);
    background: rgba(0,220,130,0.05);
  }
  .pill.dim {
    color: rgba(148,163,184,0.5);
    border-color: rgba(148,163,184,0.12);
    background: transparent;
  }
</style>
</head>
<body>

<!-- ── Background canvas ──────────────────────────────── -->
<canvas id="bg" width="1584" height="396"></canvas>

<!-- ── Content layer ──────────────────────────────────── -->
<div class="layout">
  <div class="art-zone"></div>
  <div class="vr"></div>
  <div class="text">

    <div class="term-label">
      ▸ TERMINAL_V1.0.4 &nbsp;—&nbsp; TECHNICAL OPERATIONS & TOOLING
      <span class="blink"></span>
    </div>

    <div class="name">ADITYA <span class="accent">NAIN</span></div>

    <div class="title-row">
      <div class="title-line"></div>
      <div class="title-text">AI-Augmented Architect &nbsp;·&nbsp; Solo Builder · Project Nexus WES</div>
    </div>

    <div class="sub">
      <span>Outline Systems India</span>
      <span class="sub-sep">|</span>
      <span>Asst. Team Lead — Onboarding & HR Systems</span>
      <span class="sub-sep">|</span>
      <span>Chandigarh, India</span>
    </div>

    <div class="pills">
      <span class="pill">React 19</span>
      <span class="pill">Supabase</span>
      <span class="pill">AI Orchestration</span>
      <span class="pill">Python</span>
      <span class="pill">Claude Code</span>
      <span class="pill dim">US Staffing · 5 yrs</span>
    </div>

  </div>
</div>

<!-- ── Canvas art script ───────────────────────────────── -->
<script>
(function () {
  const canvas = document.getElementById('bg');
  const ctx    = canvas.getContext('2d');
  const W = 1584, H = 396;

  /* ── 1. Deep background gradient ── */
  const bgG = ctx.createLinearGradient(0, 0, W, H);
  bgG.addColorStop(0,   '#030609');
  bgG.addColorStop(0.4, '#060b14');
  bgG.addColorStop(1,   '#080e1c');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  /* ── 2. Dot grid (very faint) ── */
  ctx.fillStyle = 'rgba(0, 220, 130, 0.055)';
  for (let x = 18; x < W; x += 30) {
    for (let y = 18; y < H; y += 30) {
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ── 3. Pinterest-style diagonal angular slabs (left zone) ── */
  // slab data: [x1_top, x2_top, x2_bot, x1_bot], opacity, color
  const slabs = [
    { pts: [[-30,0],[340,0],[430,H],[-30,H]],   alpha: 0.10, hue: '#00dc82' },
    { pts: [[60, 0],[450,0],[520,H],[140,H]],    alpha: 0.06, hue: '#00b86e' },
    { pts: [[180,0],[540,0],[580,H],[230,H]],    alpha: 0.03, hue: '#009058' },
  ];

  slabs.forEach(({ pts, alpha, hue }) => {
    const grd = ctx.createLinearGradient(0, 0, 560, H);
    grd.addColorStop(0, hue + Math.round(alpha * 255).toString(16).padStart(2,'0'));
    grd.addColorStop(1, hue + '00');
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.closePath();
    ctx.fillStyle = grd;
    ctx.fill();
  });

  /* ── 4. Glowing diagonal edge lines ── */
  const edgeLines = [
    { x1: 340, y1: 0, x2: 430, y2: H, alpha: 0.45 },
    { x1: 450, y1: 0, x2: 520, y2: H, alpha: 0.22 },
    { x1: 540, y1: 0, x2: 580, y2: H, alpha: 0.12 },
  ];

  edgeLines.forEach(({ x1, y1, x2, y2, alpha }) => {
    ctx.save();
    ctx.strokeStyle = `rgba(0,220,130,${alpha})`;
    ctx.lineWidth = 1;
    ctx.shadowColor = '#00dc82';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  });

  /* ── 5. Faint code text in left art zone ── */
  ctx.font = '9.5px "Courier New", monospace';
  const codeLines = [
    '> init nexus-wes --env=production',
    '> connect.supabase({ realtime: true })',
    '> deploy onboarding-tracker v2.4',
    '> orchestrate(ai_pipeline, scale=10k)',
    '> sla_dashboard.sync(--live)',
    '> build: react19 ++ python3.12',
    '> status: [ALL SYSTEMS OPERATIONAL]',
    '> uptime: 99.97%  latency: 18ms',
  ];
  codeLines.forEach((line, i) => {
    const fade = 0.09 + (i % 2) * 0.02;
    ctx.fillStyle = `rgba(0, 220, 130, ${fade})`;
    ctx.fillText(line, 22, 48 + i * 40);
  });

  /* ── 6. Top-right & bottom-right corner accent lines ── */
  // Top horizontal line across right panel
  ctx.save();
  ctx.strokeStyle = 'rgba(0,220,130,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(560, 8); ctx.lineTo(W - 30, 8); ctx.stroke();
  // Bottom horizontal line
  ctx.strokeStyle = 'rgba(0,220,130,0.18)';
  ctx.beginPath(); ctx.moveTo(560, H - 8); ctx.lineTo(W - 30, H - 8); ctx.stroke();
  ctx.restore();

  /* ── 7. Right-edge glow pulse ── */
  const rGlow = ctx.createLinearGradient(W - 120, 0, W, 0);
  rGlow.addColorStop(0, 'rgba(0,220,130,0.00)');
  rGlow.addColorStop(1, 'rgba(0,220,130,0.06)');
  ctx.fillStyle = rGlow;
  ctx.fillRect(W - 120, 0, 120, H);

  /* ── 8. Top-left corner bracket decoration ── */
  ctx.save();
  ctx.strokeStyle = 'rgba(0,220,130,0.35)';
  ctx.lineWidth = 1.5;
  // TL bracket
  ctx.beginPath(); ctx.moveTo(16, 34); ctx.lineTo(16, 16); ctx.lineTo(48, 16); ctx.stroke();
  // BL bracket
  ctx.beginPath(); ctx.moveTo(16, H-34); ctx.lineTo(16, H-16); ctx.lineTo(48, H-16); ctx.stroke();
  ctx.restore();

  /* ── 9. Subtle scanline texture ── */
  for (let y = 0; y < H; y += 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0, y, W, 1);
  }

  /* ── 10. Noise vignette (corners darkened) ── */
  const vign = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*1.1);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, W, H);

})();
</script>
</body>
</html>
